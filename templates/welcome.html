{% extends "_base.html" %}
{% block title %}Verdict — Welcome{% endblock %}
{% block body %}
<div class="welcome-wrap">
  <div class="welcome-hero">
    <div class="brand"><span class="dot"></span> VERDICT </div>
    <div class="welcome-word" id="welcome-word" aria-label="Welcome"></div>
    <div class="welcome-sub">Everyday banking, backed by models that watch the details for you.</div>
  </div>

  <div class="auth-card card-glass">
    <div class="role-switch" role="tablist" aria-label="Choose account type">
      <button type="button" class="active" data-role="client">I'm a client</button>
      <button type="button" data-role="manager">I'm a manager</button>
    </div>

    <div class="auth-tabs">
      <button type="button" class="active" data-tab="login">Log in</button>
      <button type="button" data-tab="signup">Create account</button>
    </div>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <!-- LOGIN -->
    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <!-- SIGNUP -->
    <form id="signup-form" style="display:none;">
      <div class="field-row">
        <div class="field"><label>Full name</label><input name="full_name" required></div>
        <div class="field"><label>Username</label><input name="username" required></div>
      </div>
      <div class="field"><label>Password</label><input name="password" type="password" required></div>
      <div class="field-row">
        <div class="field"><label>Age</label><input name="age" type="number" min="18" max="100" required></div>
        <div class="field">
          <label>Gender</label>
          <select name="gender"><option value="female">Female</option><option value="male">Male</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input name="phone" required></div>
        <div class="field"><label>Email</label><input name="email" type="email" required></div>
      </div>
      <div class="field-row client-only">
        <div class="field"><label>State</label><input name="state" maxlength="2" placeholder="e.g. NY" required></div>
        <div class="field"><label>Occupation</label><input name="job" placeholder="e.g. Teacher" required></div>
      </div>
      <div class="field-row client-only">
        <div class="field">
          <label>Geography <span class="muted" style="font-weight:400;">(segmentation model)</span></label>
          <select name="geography"><option>France</option><option>Germany</option><option>Spain</option></select>
        </div>
        <div class="field"><label>Years as a customer</label><input name="tenure_years" type="number" min="0" max="40" value="1"></div>
      </div>
      <div class="field-row client-only">
        <div class="field"><label>Annual income ($)</label><input name="income" type="number" min="0" step="1000" placeholder="e.g. 65000"></div>
        <div class="field"><label>Starting balance ($)</label><input name="balance" type="number" min="0" step="0.01" placeholder="0 — you set this"></div>
      </div>
      <div class="field-row client-only">
        <div class="field"><label>Credit score</label><input name="credit_score" type="number" min="300" max="850" placeholder="e.g. 680"></div>
        <div class="field"><label>Years employed</label><input name="employment_years" type="number" min="0" max="50" placeholder="e.g. 4"></div>
      </div>
      <div class="field-row client-only">
        <div class="field">
          <label>Home ownership</label>
          <select name="home_ownership"><option>RENT</option><option>MORTGAGE</option><option>OWN</option><option>OTHER</option></select>
        </div>
        <div class="field"><label>Credit history (years)</label><input name="credit_history_years" type="number" min="0" max="40" placeholder="e.g. 5"></div>
      </div>
      <div class="field-row client-only">
        <div class="field">
          <label>Prior loan default?</label>
          <select name="has_prior_default"><option value="No">No</option><option value="Yes">Yes</option></select>
        </div>
        <div class="field"><label>Products held</label><input name="num_of_products" type="number" min="1" max="4" value="1"></div>
      </div>
      <div class="field manager-only" style="display:none;">
        <label>Staff access code</label>
        <input name="access_code" placeholder="Provided by IT">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <!-- <div class="demo-hint">Demo logins — client: <strong>jmartin</strong> / client123 (also sfields, rkline, achen, lpatel…) &nbsp;·&nbsp; manager: <strong>manager</strong> / manager123</div> -->
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/welcome.js') }}"></script>
{% endblock %}
